<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="황량계(荒涼界) — 동양 판타지 세계관 인터랙티브 전도">
  <meta name="theme-color" content="#0e0c0a">
  <title>황량계 (荒涼界) | 동양 판타지 인터랙티브 전도</title>

  <!-- 탭 아이콘 -->
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- 링크 공유 미리보기 (카카오톡·디스코드·X 등).
       og:image 는 전체 주소여야 하므로, 실제로 배포한 주소가 다르면 아래 두 줄의 주소를 바꿔 주세요 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="황량계">
  <meta property="og:title" content="황량계 (荒涼界) — 동양 판타지 인터랙티브 전도">
  <meta property="og:description" content="국가도 법도 없이 오직 힘만이 법인 무법의 대륙. 황해를 둘러싼 네 땅과 세력을 지도로 둘러보세요.">
  <meta property="og:url" content="https://shadowland.netlify.app/">
  <meta property="og:image" content="https://shadowland.netlify.app/assets/icons/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 웹폰트: CSS @import 대신 head에서 병렬 로드 (실제 사용하는 굵기만) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap">

  <!-- 지도 이미지는 인트로 동안 미리 받아둡니다 -->
  <link rel="preload" href="assets/images/shadowland_map.webp" as="image" type="image/webp">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

  <!-- 아이콘 모음 (이모지 대신 사용 — OS 마다 모양이 달라지지 않도록). 사용: <svg class="icon"><use href="#i-warning"/></svg> -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-warning" viewBox="0 0 24 24">
      <path d="M12 3.2 2.3 20.3h19.4L12 3.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M12 9.5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="12" cy="17.4" r="1.2" fill="currentColor" />
    </symbol>
    <!-- 지도 위치 핀 (Google Material Symbols "Location On") — 모든 지점·거점 공통 -->
    <symbol id="i-location" viewBox="0 -960 960 960">
      <path d="M536.5-503.5Q560-527 560-560t-23.5-56.5Q513-640 480-640t-56.5 23.5Q400-593 400-560t23.5 56.5Q447-480 480-480t56.5-23.5ZM480-186q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z" />
    </symbol>
  </svg>

  <!-- ======================================================================
       1. 인트로 화면: 구름과 안개로 뒤덮인 인트로 (클릭 / Enter 시 좌우로 걷힘)
       ====================================================================== -->
  <div id="intro-screen" role="button" tabindex="0" aria-label="안개를 걷고 황량계 대륙으로 입장하기">
    <canvas id="mist-canvas" aria-hidden="true"></canvas>

    <div class="curtain-container" aria-hidden="true">
      <div class="cloud-curtain curtain-left"><div class="cloud-texture"></div></div>
      <div class="cloud-curtain curtain-right"><div class="cloud-texture"></div></div>
    </div>

    <div class="intro-content">
      <h1 class="intro-title" lang="zh-Hant">荒涼界</h1>
      <p class="intro-korean">황량계</p>
      <p class="intro-epigraph">황량한 이 세계에<br>황량한 이 심장에<br><span>맑은 낙원은 허용되지 않는다.</span></p>
      <p class="intro-cta" aria-hidden="true">
        <span class="cta-line"></span>
        <span class="cta-text">안개 걷기</span>
        <span class="cta-line"></span>
      </p>
    </div>
  </div>

  <!-- ======================================================================
       2. 메인 화면: 황량계 인터랙티브 판타지 지도
       (인트로가 걷히기 전까지는 inert — 키보드 포커스가 뒤로 새지 않도록)
       ====================================================================== -->
  <div id="main-screen" inert>

    <header class="top-hud">
      <div class="hud-left">
        <!-- 로고 = 홈: 누르면 족자를 닫고 전도 전체로 돌아갑니다 -->
        <button type="button" id="btn-home" class="hud-surface brand" aria-label="황량계 — 전도 전체 보기">
          <span class="brand-title" aria-hidden="true">황량계</span>
          <span class="brand-hanja" lang="zh-Hant" aria-hidden="true">荒涼界</span>
        </button>

        <!-- 배경음악 플레이어 — 곡 목록은 js/data.js 의 bgm.tracks. 인트로를 걷는 순간 자동 재생 -->
        <div class="hud-surface bgm" id="bgm-player">
          <button type="button" class="bgm-toggle" id="btn-bgm" aria-pressed="false" aria-label="배경음악 재생">
            <svg class="bgm-icon-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
            <svg class="bgm-icon-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor"/></svg>
          </button>
          <span class="bgm-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <!-- 제목을 누르면 아래로 곡 목록이 펼쳐집니다 -->
          <button type="button" class="bgm-title" id="bgm-title-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="bgm-list">
            <span class="bgm-title-text" id="bgm-title"></span>
            <svg class="bgm-caret" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6.5 9.5 12 15l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ol class="bgm-list" id="bgm-list" role="listbox" aria-label="배경음악 목록" hidden></ol>
          <label class="bgm-volume" title="볼륨">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="bgm-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="range" id="bgm-volume" min="0" max="100" step="1" aria-label="배경음악 볼륨">
          </label>
        </div>
        <audio id="bgm-audio" preload="auto"></audio>
      </div>

      <nav class="hud-surface util-controls" aria-label="세계관 도감">
        <button type="button" class="hud-btn" data-open-codex="lore" aria-haspopup="dialog">
          <span class="hud-glyph" lang="zh-Hant" aria-hidden="true">界</span>세계관
        </button>
        <button type="button" class="hud-btn" data-open-codex="people" aria-haspopup="dialog">
          <span class="hud-glyph" lang="zh-Hant" aria-hidden="true">人</span>등장인물
        </button>
      </nav>
    </header>

    <!-- 하단 조작 안내 힌트 (입력 장치에 따라 문구가 바뀌고, 처음 조작하면 사라집니다) -->
    <div class="map-hint" aria-hidden="true">
      <span class="hint-text hint-mouse"><kbd>드래그</kbd> 이동 <kbd>휠</kbd> 확대·축소 <kbd>클릭</kbd> 족자 열람</span>
      <span class="hint-text hint-touch"><kbd>밀기</kbd> 이동 <kbd>두 손가락</kbd> 확대 <kbd>탭</kbd> 족자 열람</span>
    </div>

    <!-- 확대/축소 버튼 -->
    <div class="zoom-controls" role="group" aria-label="확대/축소">
      <button type="button" id="btn-zoom-in" class="btn-zoom" aria-label="확대">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button type="button" id="btn-zoom-out" class="btn-zoom" aria-label="축소">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <!-- 지도 뷰포트: 포커스 시 방향키로 이동, +/- 확대, 0 복원 -->
    <main id="map-viewport" tabindex="0" aria-label="황량계 지도. 방향키로 이동, 더하기·빼기 키로 확대·축소, Tab으로 구역과 거점을 선택할 수 있습니다.">
      <div id="map-container">
        <svg id="fantasy-map" viewBox="0 0 2464 1856" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="황량계 전도">
          <defs>
            <filter id="marker-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="4" flood-opacity="0.85" />
            </filter>
            <!-- 구역 하이라이트를 수묵처럼 번지게 -->
            <filter id="region-soft" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="22" />
            </filter>
          </defs>

          <!-- 1. 지도 배경 이미지 (경로·크기는 js/data.js 의 map 값으로 다시 설정됩니다) -->
          <image id="map-bg-image" href="assets/images/shadowland_map.webp" x="0" y="0" width="2464" height="1856" preserveAspectRatio="none" />

          <!-- 2. 구역 경계 — js/data.js 의 regions[].polygon 으로 생성 -->
          <g id="regions-layer"></g>

          <!-- 3. 황해 야간 경고 -->
          <g id="sea-monster-warning" class="map-decor">
            <text x="1150" y="1010" class="map-text route-label" text-anchor="middle">야간 괴수 출몰</text>
            <use class="map-icon route-icon" href="#i-warning" width="22" height="22" />
          </g>

          <!-- 4. 지명 라벨 — regions[].label 로 생성 -->
          <g id="labels-layer" class="map-decor" aria-hidden="true"></g>

          <!-- 5. 지점 세력권 고리 (호버·선택 시 표시) — sites[].radius -->
          <g id="rings-layer" class="map-decor" aria-hidden="true"></g>

          <!-- 6. 지점·거점 마커 — sites[] · landmarks[] 로 생성 -->
          <g id="markers-layer"></g>
        </svg>
      </div>
    </main>

    <!-- 지도 가장자리 비네트 — 밝은 수묵 지도를 어두운 화면 틀에 녹여 줍니다 (클릭은 통과) -->
    <div class="map-vignette" aria-hidden="true"></div>

    <!-- ==================================================================
         3. 동양풍 족자(Scroll) 상세 정보 패널
         ================================================================== -->
    <aside id="info-panel" aria-labelledby="panel-title" inert>
      <div class="scroll-rod" aria-hidden="true"></div>
      <button type="button" id="btn-close-scroll" class="btn-close" aria-label="족자 닫기"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
      <div class="scroll-body">
        <div id="panel-content"></div>
      </div>
      <div class="scroll-rod" aria-hidden="true"></div>
    </aside>

    <!-- 마우스 호버 미니 툴팁 -->
    <div id="map-tooltip" aria-hidden="true"></div>
  </div>

  <!-- ==================================================================
       4. 비록(秘錄) — 세계관 / 등장인물을 탭으로 담은 창. 본문은 js/data.js 에서 생성
       ================================================================== -->
  <dialog id="codex" class="modal" aria-labelledby="codex-title">
    <header class="modal-header">
      <span class="seal-stamp" aria-hidden="true">記</span>
      <div class="modal-heading">
        <p class="modal-kicker" lang="zh-Hant">荒涼界 秘錄</p>
        <h2 id="codex-title">황량계 비록</h2>
      </div>
      <button type="button" class="btn-close" data-close-modal aria-label="닫기"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
    </header>

    <div class="modal-tabs" role="tablist" aria-label="비록 분류">
      <button type="button" role="tab" id="tab-lore" aria-controls="codex-lore" aria-selected="true">세계관</button>
      <button type="button" role="tab" id="tab-people" aria-controls="codex-people" aria-selected="false" tabindex="-1">등장인물</button>
      <button type="button" role="tab" id="tab-beasts" aria-controls="codex-beasts" aria-selected="false" tabindex="-1">괴수</button>
    </div>

    <div class="modal-body" role="tabpanel" id="codex-lore" aria-labelledby="tab-lore" tabindex="0"></div>
    <div class="modal-body" role="tabpanel" id="codex-people" aria-labelledby="tab-people" tabindex="0" hidden></div>
    <div class="modal-body" role="tabpanel" id="codex-beasts" aria-labelledby="tab-beasts" tabindex="0" hidden></div>
  </dialog>

  <!-- 스크립트 (file:// 로 더블클릭해도 동작하도록 일반 스크립트로 로드) -->
  <script src="js/data.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/map.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
