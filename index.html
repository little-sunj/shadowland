<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="황량계(荒涼界) — 동양 판타지 세계관 인터랙티브 전도">
  <meta name="theme-color" content="#0e0c0a">
  <title>황량계 (荒涼界) | 동양 판타지 인터랙티브 전도</title>

  <!-- 웹폰트: CSS @import 대신 head에서 병렬 로드 (실제 사용하는 굵기만) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap">

  <!-- 지도 이미지는 인트로 동안 미리 받아둡니다 -->
  <link rel="preload" href="assets/images/shadowland_map.webp" as="image" type="image/webp">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

  <!-- 아이콘 모음 (이모지 대신 사용 — OS 마다 모양이 달라지지 않도록). 사용: <svg class="icon"><use href="#i-sun"/></svg> -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-sun" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
      </g>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-warning" viewBox="0 0 24 24">
      <path d="M12 3.2 2.3 20.3h19.4L12 3.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M12 9.5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="12" cy="17.4" r="1.2" fill="currentColor" />
    </symbol>
    <!-- 지도 위치 핀 (Google Material Symbols "Location On") — 모든 지점·거점 공통 -->
    <symbol id="i-location" viewBox="0 -960 960 960">
      <path d="M536.5-503.5Q560-527 560-560t-23.5-56.5Q513-640 480-640t-56.5 23.5Q400-593 400-560t23.5 56.5Q447-480 480-480t56.5-23.5ZM480-186q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z" />
    </symbol>
    <symbol id="i-anchor" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="2.2" />
        <path d="M12 7.2V21M8 11h8M4.5 13.5a7.5 7.5 0 0 0 15 0" />
        <path d="M4.5 13.5 3 15.5M19.5 13.5l1.5 2" />
      </g>
    </symbol>
  </svg>

  <!-- ======================================================================
       1. 인트로 화면: 구름과 안개로 뒤덮인 인트로 (클릭 / Enter 시 좌우로 걷힘)
       ====================================================================== -->
  <div id="intro-screen" role="button" tabindex="0" aria-label="안개를 걷고 황량계 대륙으로 입장하기">
    <canvas id="mist-canvas" aria-hidden="true"></canvas>

    <div class="curtain-container" aria-hidden="true">
      <div class="cloud-curtain curtain-left"><div class="cloud-texture"></div></div>
      <div class="cloud-curtain curtain-right"><div class="cloud-texture"></div></div>
    </div>

    <div class="intro-content">
      <h1 class="intro-title" lang="zh-Hant">荒涼界</h1>
      <p class="intro-korean">황량계</p>
      <div class="intro-cta" aria-hidden="true">
        <span class="cta-icon">
          <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M11.71 17.99A5.993 5.993 0 0 1 6 12c0-3.31 2.69-6 6-6 3.22 0 5.84 2.53 5.99 5.71l-2.1-.63a3.999 3.999 0 1 0-4.81 4.81l.63 2.1zM22 12c0 .3-.01.6-.04.9l-1.97-.59c.01-.1.01-.21.01-.31 0-4.42-3.58-8-8-8s-8 3.58-8 8 3.58 8 8 8c.1 0 .21 0 .31-.01l.59 1.97c-.3.03-.6.04-.9.04-5.52 0-10-4.48-10-10S6.48 2 12 2s10 4.48 10 10zm-3.77 4.26L22 15l-10-3 3 10 1.26-3.77 4.27 4.27 1.98-1.98-4.28-4.26z"/></svg>
        </span>
      </div>
    </div>
  </div>

  <!-- ======================================================================
       2. 메인 화면: 황량계 인터랙티브 판타지 지도
       (인트로가 걷히기 전까지는 inert — 키보드 포커스가 뒤로 새지 않도록)
       ====================================================================== -->
  <div id="main-screen" inert>

    <header class="top-hud">
      <div class="brand-section">
        <p class="brand-title">황량계</p>
      </div>

      <nav class="util-controls" aria-label="지도 도구">
        <button type="button" id="btn-lore-modal" class="btn-oriental" aria-haspopup="dialog">세계관</button>
        <button type="button" id="btn-characters-modal" class="btn-oriental" aria-haspopup="dialog">등장인물</button>
        <button type="button" id="btn-daynight" class="btn-oriental" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg><span class="btn-label">주간</span></button>
        <button type="button" id="btn-reset-view" class="btn-oriental">전도 복원</button>
      </nav>
    </header>

    <!-- 야간 모드 시 황해 괴수 경고 배너 -->
    <div class="night-warning-banner" role="status" aria-live="polite"></div>

    <!-- 하단 조작 안내 힌트 (입력 장치에 따라 문구가 바뀝니다) -->
    <div class="map-hint" aria-hidden="true">
      <span class="hint-badge">◈ 지도 탐색</span>
      <span class="hint-text hint-mouse">드래그: 이동 | 휠: 확대/축소 | 구역·거점 클릭: 족자 열람</span>
      <span class="hint-text hint-touch">밀어서 이동 | 두 손가락: 확대/축소 | 탭: 족자 열람</span>
    </div>

    <!-- 확대/축소 버튼 -->
    <div class="zoom-controls" role="group" aria-label="확대/축소">
      <button type="button" id="btn-zoom-in" class="btn-oriental btn-zoom" aria-label="확대">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button type="button" id="btn-zoom-out" class="btn-oriental btn-zoom" aria-label="축소">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <!-- 지도 뷰포트: 포커스 시 방향키로 이동, +/- 확대, 0 복원 -->
    <main id="map-viewport" tabindex="0" aria-label="황량계 지도. 방향키로 이동, 더하기·빼기 키로 확대·축소, Tab으로 구역과 거점을 선택할 수 있습니다.">
      <div id="map-container">
        <svg id="fantasy-map" viewBox="0 0 2464 1856" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="황량계 전도">
          <defs>
            <filter id="marker-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="4" flood-opacity="0.85" />
            </filter>
            <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-opacity="0.9" />
            </filter>
            <!-- 구역 하이라이트를 수묵처럼 번지게 -->
            <filter id="region-soft" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="22" />
            </filter>
          </defs>

          <!-- 1. 지도 배경 이미지 (경로·크기는 js/data.js 의 map 값으로 다시 설정됩니다) -->
          <image id="map-bg-image" href="assets/images/shadowland_map.webp" x="0" y="0" width="2464" height="1856" preserveAspectRatio="none" />
          <!-- 야간 달빛 틴트 (야간 모드에서만 보임) -->
          <rect id="night-tint" x="0" y="0" width="2464" height="1856" />

          <!-- 2. 구역 경계 — js/data.js 의 regions[].polygon 으로 생성 -->
          <g id="regions-layer"></g>

          <!-- 3. 주간 뱃길 (야간에는 사라짐) -->
          <g id="day-shipping-route" class="map-decor">
            <path class="route-line" d="M 790,985 C 960,1060 1330,1065 1525,955" stroke-width="4.5" stroke-dasharray="13,10" fill="none" opacity="0.9" />
            <text x="1150" y="1010" class="map-text route-label" text-anchor="middle">주간 유일 뱃길</text>
            <use class="map-icon route-icon" href="#i-anchor" width="22" height="22" />
          </g>

          <!-- 4. 야간 황해 괴수 (야간에만 표시, 클릭 시 '황해 중심 소용돌이' 거점 열람) -->
          <g id="monster-group" aria-hidden="true">
            <g transform="translate(1150 870) scale(1.6)">
              <ellipse class="monster-body" cx="0" cy="0" rx="42" ry="24" stroke-width="2" />
            <circle class="monster-eye" cx="-14" cy="-4" r="3" filter="url(#red-glow)" />
            <circle class="monster-eye" cx="14" cy="-4" r="3" filter="url(#red-glow)" />
            <text x="0" y="40" class="map-text monster-label" text-anchor="middle">황해 심해 괴수</text>
            <use class="map-icon monster-icon" href="#i-warning" width="13" height="13" />
           </g>
          </g>

          <!-- 5. 지명 라벨 — regions[].label 로 생성 -->
          <g id="labels-layer" class="map-decor" aria-hidden="true"></g>

          <!-- 6. 지점 세력권 고리 (호버·선택 시 표시) — sites[].radius -->
          <g id="rings-layer" class="map-decor" aria-hidden="true"></g>

          <!-- 7. 지점·거점 마커 — sites[] · landmarks[] 로 생성 -->
          <g id="markers-layer"></g>

          <!-- 8. 좌측 하단 고지도 낙관 도장 -->
          <g id="map-legend-stamp" class="map-decor" transform="translate(2180, 1730) scale(1.6)" aria-hidden="true">
            <rect class="stamp-box" x="0" y="0" width="130" height="60" rx="3" />
            <text class="map-text stamp-title" x="16" y="25">荒涼界 輿地圖</text>
            <text class="map-text stamp-sub" x="16" y="44">無法之界 · 力量至上</text>
          </g>
        </svg>
      </div>
    </main>

    <!-- ==================================================================
         3. 동양풍 족자(Scroll) 상세 정보 패널
         ================================================================== -->
    <aside id="info-panel" aria-labelledby="panel-title" inert>
      <div class="scroll-rod" aria-hidden="true"></div>
      <button type="button" id="btn-close-scroll" class="btn-close on-hanji" aria-label="족자 닫기">✕</button>
      <div class="scroll-body">
        <div id="panel-content" aria-live="polite"></div>
      </div>
      <div class="scroll-rod" aria-hidden="true"></div>
    </aside>

    <!-- 마우스 호버 미니 툴팁 -->
    <div id="map-tooltip" aria-hidden="true"></div>
  </div>

  <!-- ==================================================================
       4. 세계관 / 등장인물 모달 — 본문은 js/data.js 에서 생성
       ================================================================== -->
  <div id="lore-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="lore-modal-title" hidden>
    <div class="modal-scroll-card">
      <div class="modal-header">
        <h2 id="lore-modal-title"><span class="seal-stamp" aria-hidden="true">記</span> 황량계(荒涼界) 세계관 비록(秘錄)</h2>
        <button type="button" class="btn-close on-hanji" data-close-modal aria-label="세계관 닫기">✕</button>
      </div>
      <div class="modal-body" id="lore-modal-body"></div>
    </div>
  </div>

  <div id="characters-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="characters-modal-title" hidden>
    <div class="modal-scroll-card">
      <div class="modal-header">
        <h2 id="characters-modal-title"><span class="seal-stamp" aria-hidden="true">人</span> 황량계(荒涼界) 주요 인물</h2>
        <button type="button" class="btn-close on-hanji" data-close-modal aria-label="등장인물 닫기">✕</button>
      </div>
      <div class="modal-body" id="characters-modal-body"></div>
    </div>
  </div>

  <!-- 스크립트 (file:// 로 더블클릭해도 동작하도록 일반 스크립트로 로드) -->
  <script src="js/data.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
